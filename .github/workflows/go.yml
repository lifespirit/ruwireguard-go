name: GOST build, rekey, roaming and performance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-curve-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build all packages with vendored dependencies
        run: go build -mod=vendor ./...
      - name: Run complete Go test suite
        run: go test -mod=vendor -count=1 ./...
      - name: Test concurrent curve operations
        run: go test -mod=vendor -count=1 -run '^TestConcurrentExpAndVKO$' ./crypto/gost/gost3410
      - name: Check concurrent curve operations with the race detector
        run: go test -mod=vendor -race -count=1 -run '^TestConcurrentExpAndVKO$' ./crypto/gost/gost3410
      - name: Check repeated GOST rekey with the race detector
        run: go test -mod=vendor -race -count=1 -run '^TestGOSTSessionRekeyAndKeyRotation$' ./device
      - name: Measure baseline GOST crypto performance (microbenchmarks)
        run: |
          go test -mod=vendor -run '^$' -bench '^(BenchmarkTC26VKO2012_256|BenchmarkTC26CompressedPublicKeyValidation)$' -benchtime=100ms ./crypto/gost/gost3410
          go test -mod=vendor -run '^$' -bench '^BenchmarkRuWireGuardKuznyechikMGM/.*1280$' -benchtime=100ms ./crypto/mgm

  linux-gost-tunnel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Linux namespace test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping kmod
          sudo modprobe tun || true
          test -c /dev/net/tun
      - name: Build GOST userspace daemon and bundled wg tool
        run: |
          mkdir -p bin
          go build -mod=vendor -o bin/ruwireguard-go .
          go build -mod=vendor -o bin/ruwg ./cmd/wgctrl
      - name: Test encrypted IPv4/IPv6 traffic and UDP endpoint roaming
        run: sudo bash tests/smoke-gost-netns.sh ./bin/ruwireguard-go ./bin/ruwg
